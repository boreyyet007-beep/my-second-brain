<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Second Brain | Finance Auth</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <div class="auth-card">
        <div class="brand-block">
          <div class="brand-icon">💰</div>
          <h1>My Second Brain</h1>
          <p>Private personal finance workspace</p>
        </div>

        <div id="authStatus" class="message message-info">
          Configure your Supabase URL and anon key in <strong>config.js</strong> to start.
        </div>

        <div class="toggle-row">
          <button class="toggle-btn active" data-mode="login">Log in</button>
          <button class="toggle-btn" data-mode="signup">Sign up</button>
        </div>

        <form id="authForm" class="auth-form">
          <label>
            <span>Email</span>
            <input id="email" type="email" placeholder="you@example.com" required />
          </label>

          <label>
            <span>Password</span>
            <input id="password" type="password" placeholder="••••••••" required />
          </label>

          <label id="nameField" class="hidden">
            <span>Full name</span>
            <input id="fullName" type="text" placeholder="John Doe" />
          </label>

          <button id="submitAuthBtn" type="submit" class="primary-btn">Log in</button>
        </form>

        <div id="loggedInState" class="logged-in hidden">
          <div class="user-summary">
            <div>
              <p class="small-text">Signed in as</p>
              <strong id="userEmail">-</strong>
            </div>
            <button id="logoutBtn" class="secondary-btn">Log out</button>
          </div>

          <form id="transactionForm" class="transaction-form">
            <h2>Add transaction</h2>

            <div class="input-row two-col">
              <label>
                <span>Type</span>
                <select id="txType">
                  <option value="expense">Expense</option>
                  <option value="income">Income</option>
                </select>
              </label>

              <label>
                <span>Date</span>
                <input id="txDate" type="date" required />
              </label>
            </div>

            <div class="input-row two-col">
              <label>
                <span>Amount</span>
                <input id="txAmount" type="number" step="0.01" min="0.01" required placeholder="0.00" />
              </label>

              <label>
                <span>Currency</span>
                <select id="txCurrency">
                  <option value="USD">USD</option>
                  <option value="KHR">KHR</option>
                </select>
              </label>
            </div>

            <label>
              <span>Category</span>
              <input id="txCategory" type="text" placeholder="Food, Salary, Transport..." required />
            </label>

            <label>
              <span>Description</span>
              <input id="txDescription" type="text" placeholder="Optional note" />
            </label>

            <button type="submit" class="primary-btn">Save transaction</button>
          </form>

          <div class="transactions-box">
            <div class="section-header">
              <h2>My transactions</h2>
            </div>
            <div id="transactionsList" class="transactions-list"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
